<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TGTV – logga in</title>
<style>
  :root { --bg: #0d1016; --card: #161b24; --line: #2a3242; --text: #e8ecf3; --muted: #8b95a7; --accent: #3d8bfd; --gold: #f5c518; --red: #e5484d; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: flex-start; justify-content: center; padding: 48px 16px; }
  main { width: 100%; max-width: 420px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -.3px; } h1 span { color: var(--gold); }
  .lead { color: var(--muted); margin: 0 0 28px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 0 0 6px; }
  input { width: 100%; font: inherit; color: var(--text); background: #0f131a; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 0 0 16px; }
  input:focus { outline: none; border-color: var(--accent); }
  #code { font-size: 28px; letter-spacing: 4px; text-transform: uppercase; text-align: center; font-weight: 700; }
  button { width: 100%; font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 13px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; }
  button.link { background: none; color: var(--accent); padding: 10px 0 0; font-weight: 500; width: auto; }
  .links { display: flex; justify-content: space-between; margin-top: 6px; }
  h2 { font-size: 20px; margin: 0 0 16px; }
  .msg { min-height: 22px; margin: 14px 0 0; font-size: 15px; color: var(--muted); }
  .msg.err { color: var(--red); }
  .who { color: var(--muted); margin: 0 0 16px; font-size: 15px; } .who b { color: var(--text); }
  .done { text-align: center; } .done .big { font-size: 48px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>TG<span>TV</span></h1>
  <p class="lead">Koppla TV:n till ditt konto.</p>

  <section class="card" id="step-login">
    <h2>Logga in</h2>
    <label for="email">E-post</label>
    <input id="email" type="email" autocomplete="email" inputmode="email">
    <label for="password">Lösenord</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="signin">Logga in</button>
    <p class="msg" id="msg1"></p>
    <div class="links"><button class="link" id="to-signup">Skapa konto</button><button class="link" id="to-forgot">Glömt lösenordet?</button></div>
  </section>

  <section class="card" id="step-signup" hidden>
    <h2>Skapa konto</h2>
    <label for="su-email">E-post</label>
    <input id="su-email" type="email" autocomplete="email" inputmode="email">
    <label for="su-password">Välj lösenord (minst 6 tecken)</label>
    <input id="su-password" type="password" autocomplete="new-password">
    <label for="su-password2">Upprepa lösenordet</label>
    <input id="su-password2" type="password" autocomplete="new-password">
    <button id="signup">Skapa konto</button>
    <p class="msg" id="msg-su"></p>
    <div class="links"><button class="link" id="su-back">Har du redan ett konto? Logga in</button></div>
  </section>

  <section class="card" id="step-forgot" hidden>
    <h2>Glömt lösenordet</h2>
    <p class="who">Vi skickar en länk där du väljer ett nytt lösenord.</p>
    <label for="fg-email">E-post</label>
    <input id="fg-email" type="email" autocomplete="email" inputmode="email">
    <button id="forgot">Skicka länk</button>
    <p class="msg" id="msg-fg"></p>
    <div class="links"><button class="link" id="fg-back">Tillbaka till inloggningen</button></div>
  </section>

  <section class="card" id="step-newpw" hidden>
    <h2>Välj nytt lösenord</h2>
    <label for="np-password">Nytt lösenord (minst 6 tecken)</label>
    <input id="np-password" type="password" autocomplete="new-password">
    <button id="newpw">Spara lösenordet</button>
    <p class="msg" id="msg-np"></p>
  </section>

  <section class="card" id="step-code" hidden>
    <p class="who">Inloggad som <b id="who"></b></p>
    <label for="code">Koden som visas på TV:n</label>
    <input id="code" autocomplete="off" autocapitalize="characters" maxlength="7" placeholder="ABC-DEF">
    <button id="approve">Koppla TV:n</button>
    <p class="msg" id="msg2"></p>
  </section>

  <section class="card done" id="step-done" hidden>
    <div class="big">✓</div>
    <h2>Klart!</h2>
    <p class="lead">TV:n loggas in om några sekunder. Du kan stänga sidan.</p>
  </section>
</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var cfg = window.TGTV || {};
  if (!cfg.url || !cfg.key || !window.supabase) {
    document.querySelector('main').insertAdjacentHTML('beforeend', '<p class="msg err">Sidan är inte färdiginställd än (config.js saknar Supabase-adressen eller nyckeln).</p>');
    document.getElementById('step-login').hidden = true;
    return;
  }
  // Sidan sparar ingen inloggning och förnyar den inte: den lämnas över till TV:n, som förnyar den själv.
  var sb = window.supabase.createClient(cfg.url, cfg.key, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: true, flowType: 'implicit' }
  });
  var session = null;
  var params = new URLSearchParams(location.search);
  if (params.get('code')) $('code').value = format(params.get('code'));
  // Länkar i mejl (bekräfta konto, nytt lösenord) leder tillbaka hit med koden kvar.
  var back = location.origin + location.pathname + (params.get('code') ? '?code=' + encodeURIComponent(params.get('code')) +
    (params.get('unlock') === '1' ? '&unlock=1' : '') : '');

  function format(c) {
    c = String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
    return c.length > 3 ? c.slice(0, 3) + '-' + c.slice(3) : c;
  }
  function msg(id, text, err) { var m = $(id); m.textContent = text || ''; m.classList.toggle('err', !!err); }
  var STEPS = ['step-login', 'step-signup', 'step-forgot', 'step-newpw', 'step-code', 'step-done'];
  function show(step) { STEPS.forEach(function (s) { $(s).hidden = s !== step; }); }
  function sv(e) {
    var m = e && e.message || String(e);
    if (/Invalid login credentials/i.test(m)) return 'Fel e-post eller lösenord.';
    if (/Email not confirmed/i.test(m)) return 'Kontot är inte bekräftat än – öppna länken i mejlet vi skickade.';
    if (/already registered|already been registered/i.test(m)) return 'Det finns redan ett konto med den e-postadressen. Logga in, eller välj Glömt lösenordet.';
    if (/rate limit/i.test(m)) return 'För många mejl just nu. Vänta en stund och försök igen.';
    if (/Password should be at least/i.test(m)) return 'Lösenordet måste ha minst 6 tecken.';
    return m;
  }

  function loggedIn(s) {
    session = s;
    $('who').textContent = s.user.email;
    show('step-code');
    if ($('code').value.replace(/[^A-Z0-9]/gi, '').length === 6) $('approve').focus(); else $('code').focus();
  }

  var recovering = false;
  sb.auth.onAuthStateChange(function (event, s) {
    if (event === 'PASSWORD_RECOVERY') { recovering = true; session = s; show('step-newpw'); }
  });
  // Tillbaka från ett mejl: inloggningen finns i adressen.
  sb.auth.getSession().then(function (r) {
    if (recovering || !(r.data && r.data.session)) return;
    if (/type=recovery/.test(location.hash)) { session = r.data.session; show('step-newpw'); return; }
    loggedIn(r.data.session);
  });

  $('code').addEventListener('input', function () { this.value = format(this.value); });
  $('to-signup').onclick = function () { $('su-email').value = $('email').value; show('step-signup'); };
  $('to-forgot').onclick = function () { $('fg-email').value = $('email').value; show('step-forgot'); };
  $('su-back').onclick = $('fg-back').onclick = function () { show('step-login'); };

  $('signin').onclick = function () {
    var b = this;
    b.disabled = true; msg('msg1', 'Loggar in…');
    sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value }).then(function (r) {
      b.disabled = false;
      if (r.error) { msg('msg1', sv(r.error), true); return; }
      msg('msg1', '');
      loggedIn(r.data.session);
    });
  };

  $('signup').onclick = function () {
    var b = this;
    var email = $('su-email').value.trim(), pw = $('su-password').value;
    if (!email) { msg('msg-su', 'Skriv din e-postadress.', true); return; }
    if (pw.length < 6) { msg('msg-su', 'Lösenordet måste ha minst 6 tecken.', true); return; }
    if (pw !== $('su-password2').value) { msg('msg-su', 'Lösenorden är inte lika.', true); return; }
    b.disabled = true; msg('msg-su', 'Skapar konto…');
    sb.auth.signUp({ email: email, password: pw, options: { emailRedirectTo: back } }).then(function (r) {
      b.disabled = false;
      if (r.error) { msg('msg-su', sv(r.error), true); return; }
      if (r.data.session) { loggedIn(r.data.session); return; }
      msg('msg-su', 'Kontot är skapat! Öppna länken i mejlet vi skickade till ' + email + ' (på den här telefonen), så kommer du tillbaka hit inloggad.');
    });
  };

  $('forgot').onclick = function () {
    var b = this;
    var email = $('fg-email').value.trim();
    if (!email) { msg('msg-fg', 'Skriv din e-postadress.', true); return; }
    b.disabled = true; msg('msg-fg', 'Skickar…');
    sb.auth.resetPasswordForEmail(email, { redirectTo: back }).then(function (r) {
      b.disabled = false;
      if (r.error) { msg('msg-fg', sv(r.error), true); return; }
      msg('msg-fg', 'Om det finns ett konto för ' + email + ' har vi skickat en länk. Öppna den på den här telefonen.');
    });
  };

  $('newpw').onclick = function () {
    var b = this;
    var pw = $('np-password').value;
    if (pw.length < 6) { msg('msg-np', 'Lösenordet måste ha minst 6 tecken.', true); return; }
    b.disabled = true; msg('msg-np', 'Sparar…');
    sb.auth.updateUser({ password: pw }).then(function (r) {
      b.disabled = false;
      if (r.error) { msg('msg-np', sv(r.error), true); return; }
      // Inloggad med det nya lösenordet: fortsätt med koden från TV:n.
      sb.auth.getSession().then(function (x) { loggedIn((x.data && x.data.session) || session); });
    });
  };

  // Upplåsning (barnprofil, vuxenkategorier): TV:n är redan inloggad och behöver bara veta att
  // kontot godkänner. Sidan lämnar då bara sin kortlivade åtkomsttoken, inte inloggningen.
  var unlock = params.get('unlock') === '1';
  if (unlock) {
    document.querySelector('.lead').textContent = 'Godkänn på TV:n med ditt konto.';
    $('approve').textContent = 'Godkänn';
    document.querySelector('#step-done .lead').textContent = 'Godkänt. TV:n låses upp om några sekunder. Du kan stänga sidan.';
  }

  $('approve').onclick = function () {
    var b = this;
    var code = $('code').value.replace(/[^A-Z0-9]/gi, '');
    if (code.length !== 6) { msg('msg2', 'Koden har sex tecken, t.ex. ABC-DEF.', true); return; }
    b.disabled = true; msg('msg2', unlock ? 'Godkänner…' : 'Kopplar…');
    sb.rpc('approve_device_login', { p_code: code, p_refresh_token: unlock ? session.access_token : session.refresh_token }).then(function (r) {
      b.disabled = false;
      if (r.error) { msg('msg2', r.error.message, true); return; }
      if (!r.data) { msg('msg2', 'Koden hittades inte eller har gått ut. Starta inloggningen igen på TV:n.', true); return; }
      show('step-done');
    });
  };
})();
</script>
</body>
</html>
